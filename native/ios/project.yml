name: WhyLint
options:
  bundleIdPrefix: app.whylint
  deploymentTarget:
    iOS: '17.0'
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    WHYLINT_API_URL: 'https:/$()/whylint-8715935974.asia-northeast1.run.app'
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.1.0
targets:
  WhyLint:
    type: application
    platform: iOS
    sources:
      - path: WhyLint
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.whylint.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: WhyLint/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
    scheme:
      testTargets: [WhyLintUITests]
  WhyLintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WhyLintUITests]
    dependencies:
      - target: WhyLint
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.whylint.native.uitests
