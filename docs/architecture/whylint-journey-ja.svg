stroke-width="2"/><text x="1866" y="198" font-size="16" font-weight="700" fill="#0f766e">ホーム画面の指標</text><text x="1866" y="220" font-size="14" fill="#4b5563">連続日数・今日の目標5問・レベル</text><text x="1866" y="239" font-size="14" fill="#4b5563">・コンボ</text><path d="M1978.0 260 V290" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1852" y="292" width="252" height="88" rx="12" fill="#fff" stroke="#12a4a0" stroke-width="2"/><text x="1866" y="320" font-size="16" font-weight="700" fill="#0f766e">実績</text><text x="1866" y="342" font-size="14" fill="#4b5563">バッジ、習熟度レーダー、週間ラン</text><text x="1866" y="361" font-size="14" fill="#4b5563">キング</text><path d="M1978.0 382 V412" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1852" y="414" width="252" height="69" rx="12" fill="#fff" stroke="#12a4a0" stroke-width="2"/><text x="1866" y="442" font-size="16" font-weight="700" fill="#0f766e">復習と保存</text><text x="1866" y="464" font-size="14" fill="#4b5563">復習待ちの問題と保存した問題</text><path d="M1978.0 485 V515" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1852" y="517" width="252" height="88" rx="12" fill="#fff" stroke="#12a4a0" stroke-width="2"/><text x="1866" y="545" font-size="16" font-weight="700" fill="#0f766e">履歴と設定</text><text x="1866" y="567" font-size="14" fill="#4b5563">学習履歴、言語、テーマ、ユーザー</text><text x="1866" y="586" font-size="14" fill="#4b5563">名</text><path d="M1978.0 607 V637" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1852" y="639" width="252" height="88" rx="12" fill="#fff" stroke="#12a4a0" stroke-width="2"/><text x="1866" y="667" font-size="16" font-weight="700" fill="#0f766e">ログアウト／退会</text><text x="1866" y="689" font-size="14" fill="#4b5563">退会で個人データは削除、投稿した</text><text x="1866" y="708" font-size="14" fill="#4b5563">問題は匿名で残る</text><text x="40" y="909" font-size="15" fill="#374151">• AIを使うのは4か所だけ：出題の生成（3）、説明の採点・追加質問（4）、投稿のレビュー（5）。タップの採点はAIを使わず、サーバーが保存済みの正解と比べます。</