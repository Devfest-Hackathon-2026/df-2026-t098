<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2144 979" width="2144" height="979" font-family="'Hiragino Sans','Noto Sans JP','Helvetica Neue',Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="2144" height="979" fill="#fff"/><text x="1072" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#111827">WhyLint ユーザーフロー（初回から全機能まで）</text><text x="1072" y="86" text-anchor="middle" font-size="15" fill="#6b7280">左から右へ進みます。各列は1つの段階です</text><rect x="30" y="116" width="272" height="546" rx="16" fill="#f1f3f4" fill-opacity="0.45"/><rect x="30" y="116" width="272" height="40" rx="16" fill="#9aa0a6"/><rect x="30" y="136" width="272" height="20" fill="#9aa0a6"/><text x="166.0" y="142" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">0 · はじめて開く</text><rect x="40" y="170" width="252" height="89" rx="12" fill="#fff" stroke="#9aa0a6" stroke-width="2"/><text x="54" y="198" font-size="16" font-weight="700" fill="#374151">whylint.com またはアプリ</text><text x="54" y="218" font-size="16" font-weight="700" fill="#374151">を開く</text><text x="54" y="240" font-size="14" fill="#4b5563">Web · iOS · Android</text><path d="M166.0 261 V291" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="293" width="252" height="108" rx="12" fill="#fff" stroke="#9aa0a6" stroke-width="2"/><text x="54" y="321" font-size="16" font-weight="700" fill="#374151">サーバーが最初の言語を決め</text><text x="54" y="341" font-size="16" font-weight="700" fill="#374151">る</text><text x="54" y="363" font-size="14" fill="#4b5563">IPから国を判定。日本=日本語、そ</text><text x="54" y="382" font-size="14" fill="#4b5563">れ以外=英語</text><path d="M166.0 403 V433" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="435" width="252" height="88" rx="12" fill="#fff" stroke="#9aa0a6" stroke-width="2"/><text x="54" y="463" font-size="16" font-weight="700" fill="#374151">オンボーディング</text><text x="54" y="485" font-size="14" fill="#4b5563">興味・技術・難易度を選ぶ（スキッ</text><text x="54" y="504" font-size="14" fill="#4b5563">プも可）</text><path d="M166.0 525 V555" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="40" y="557" width="252" height="69" rx="12" fill="#fff" stroke="#9aa0a6" stroke-width="2"/><text x="54" y="585" font-size="16" font-weight="700" fill="#374151">設定をこの端末に保存</text><text x="54" y="607" font-size="14" fill="#4b5563">ログイン後にアカウントへ同期</text><path d="M292 591.5 H317.0 V214.0 H340" stroke="#9aa0a6" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="332" y="116" width="272" height="750" rx="16" fill="#e8f0fe" fill-opacity="0.45"/><rect x="332" y="116" width="272" height="40" rx="16" fill="#4285f4"/><rect x="332" y="136" width="272" height="20" fill="#4285f4"/><text x="468.0" y="142" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">1 · ゲストで学ぶ</text><rect x="342" y="170" width="252" height="88" rx="12" fill="#fff" stroke="#4285f4" stroke-width="2"/><text x="356" y="198" font-size="16" font-weight="700" fill="#1d4ed8">問題フィード</text><text x="356" y="220" font-size="14" fill="#4b5563">同梱の問題プール179問（日英）か</text><text x="356" y="239" font-size="14" fill="#4b5563">ら出題</text><path d="M468.0 260 V290" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="342" y="292" width="252" height="69" rx="12" fill="#fff" stroke="#4285f4" stroke-width="2"/><text x="356" y="320" font-size="16" font-weight="700" fill="#1d4ed8">今日のバグ</text><text x="356" y="342" font-size="14" fill="#4b5563">GET /daily</text><path d="M468.0 363 V393" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="342" y="395" width="252" height="88" rx="12" fill="#fff" stroke="#4285f4" stroke-width="2"/><text x="356" y="423" font-size="16" font-weight="700" fill="#1d4ed8">タップで回答</text><text x="356" y="445" font-size="14" fill="#4b5563">選択式・○×・出力予想・バグの行</text><text x="356" y="464" font-size="14" fill="#4b5563">をタップ</text><path d="M468.0 485 V515" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="342" y="517" width="252" height="88" rx="12" fill="#fff" stroke="#4285f4" stroke-width="2"/><text x="356" y="545" font-size="16" font-weight="700" fill="#1d4ed8">サーバーが採点</text><text x="356" y="567" font-size="14" fill="#4b5563">保存済みの正解と比較。AIなし・</text><text x="356" y="586" font-size="14" fill="#4b5563">保存なし</text><path d="M468.0 607 V637" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="342" y="639" width="252" height="88" rx="12" fill="#fff" stroke="#4285f4" stroke-width="2"/><text x="356" y="667" font-size="16" font-weight="700" fill="#1d4ed8">すぐに解説</text><text x="356" y="689" font-size="14" fill="#4b5563">短い解説を表示。共有リンクも使え</text><text x="356" y="708" font-size="14" fill="#4b5563">る</text><path d="M468.0 729 V759" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="342" y="761" width="252" height="69" rx="12" fill="#fff" stroke="#4285f4" stroke-width="2"/><text x="356" y="789" font-size="16" font-weight="700" fill="#1d4ed8">3問でログイン案内</text><text x="356" y="811" font-size="14" fill="#4b5563">進捗を残すには登録が必要</text><path d="M594 795.5 H619.0 V214.0 H642" stroke="#4285f4" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="634" y="116" width="272" height="525" rx="16" fill="#e6f4ea" fill-opacity="0.45"/><rect x="634" y="116" width="272" height="40" rx="16" fill="#34a853"/><rect x="634" y="136" width="272" height="20" fill="#34a853"/><text x="770.0" y="142" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2 · アカウント</text><rect x="644" y="170" width="252" height="88" rx="12" fill="#fff" stroke="#34a853" stroke-width="2"/><text x="658" y="198" font-size="16" font-weight="700" fill="#15803d">登録またはログイン</text><text x="658" y="220" font-size="14" fill="#4b5563">メール+パスワード、または</text><text x="658" y="239" font-size="14" fill="#4b5563">Google</text><path d="M770.0 260 V290" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="644" y="292" width="252" height="88" rx="12" fill="#fff" stroke="#34a853" stroke-width="2"/><text x="658" y="320" font-size="16" font-weight="700" fill="#15803d">セッション作成</text><text x="658" y="342" font-size="14" fill="#4b5563">Web：Cookie、ネイティブ：</text><text x="658" y="361" font-size="14" fill="#4b5563">Bearerトークン</text><path d="M770.0 382 V412" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="644" y="414" width="252" height="88" rx="12" fill="#fff" stroke="#34a853" stroke-width="2"/><text x="658" y="442" font-size="16" font-weight="700" fill="#15803d">ゲストの回答を取り込む</text><text x="658" y="464" font-size="14" fill="#4b5563">POST guest-answers（最大200</text><text x="658" y="483" font-size="14" fill="#4b5563">件、XPの二重付与なし）</text><path d="M770.0 504 V534" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="644" y="536" width="252" height="69" rx="12" fill="#fff" stroke="#34a853" stroke-width="2"/><text x="658" y="564" font-size="16" font-weight="700" fill="#15803d">設定を復元</text><text x="658" y="586" font-size="14" fill="#4b5563">別の端末でも同じ設定</text><path d="M896 570.5 H921.0 V223.5 H944" stroke="#34a853" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="936" y="116" width="272" height="769" rx="16" fill="#fef7e0" fill-opacity="0.45"/><rect x="936" y="116" width="272" height="40" rx="16" fill="#f9ab00"/><rect x="936" y="136" width="272" height="20" fill="#f9ab00"/><text x="1072.0" y="142" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3 · あなた向けの出題</text><rect x="946" y="170" width="252" height="107" rx="12" fill="#fff" stroke="#f9ab00" stroke-width="2"/><text x="960" y="198" font-size="16" font-weight="700" fill="#a16207">バッチを開始</text><text x="960" y="220" font-size="14" fill="#4b5563">POST feed/batches +</text><text x="960" y="239" font-size="14" fill="#4b5563">requestId（再送しても重複なし</text><text x="960" y="258" font-size="14" fill="#4b5563">）</text><path d="M1072.0 279 V309" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="946" y="311" width="252" height="88" rx="12" fill="#fff" stroke="#f9ab00" stroke-width="2"/><text x="960" y="339" font-size="16" font-weight="700" fill="#a16207">Geminiが5問を作る</text><text x="960" y="361" font-size="14" fill="#4b5563">興味・難易度・苦手・最近の概念を</text><text x="960" y="380" font-size="14" fill="#4b5563">考慮</text><path d="M1072.0 401 V431" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="946" y="433" width="252" height="88" rx="12" fill="#fff" stroke="#f9ab00" stroke-width="2"/><text x="960" y="461" font-size="16" font-weight="700" fill="#a16207">品質チェック</text><text x="960" y="483" font-size="14" fill="#4b5563">無効な問題は除外、似た問題は出さ</text><text x="960" y="502" font-size="14" fill="#4b5563">ない</text><path d="M1072.0 523 V553" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="946" y="555" width="252" height="88" rx="12" fill="#fff" stroke="#f9ab00" stroke-width="2"/><text x="960" y="583" font-size="16" font-weight="700" fill="#a16207">プールで補う</text><text x="960" y="605" font-size="14" fill="#4b5563">足りない分と復習（最大3問）、コ</text><text x="960" y="624" font-size="14" fill="#4b5563">ミュニティ問題は1問まで</text><path d="M1072.0 645 V675" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="946" y="677" width="252" height="69" rx="12" fill="#fff" stroke="#f9ab00" stroke-width="2"/><text x="960" y="705" font-size="16" font-weight="700" fill="#a16207">3枚目で次のバッチ</text><text x="960" y="727" font-size="14" fill="#4b5563">スクロールを止めずに先読み</text><path d="M1072.0 748 V778" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="946" y="780" width="252" height="69" rx="12" fill="#fff" stroke="#f9ab00" stroke-width="2"/><text x="960" y="808" font-size="16" font-weight="700" fill="#a16207">Gemini障害でも続行</text><text x="960" y="830" font-size="14" fill="#4b5563">プールだけで出題を継続</text><path d="M1198 814.5 H1223.0 V204.5 H1246" stroke="#f9ab00" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="1238" y="116" width="272" height="750" rx="16" fill="#fce8e6" fill-opacity="0.45"/><rect x="1238" y="116" width="272" height="40" rx="16" fill="#ea4335"/><rect x="1238" y="136" width="272" height="20" fill="#ea4335"/><text x="1374.0" y="142" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4 · 答えて伸びる</text><rect x="1248" y="170" width="252" height="69" rx="12" fill="#fff" stroke="#ea4335" stroke-width="2"/><text x="1262" y="198" font-size="16" font-weight="700" fill="#b91c1c">タップで回答</text><text x="1262" y="220" font-size="14" fill="#4b5563">初回は+5XP、連続正解でコンボ</text><path d="M1374.0 241 V271" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1248" y="273" width="252" height="88" rx="12" fill="#fff" stroke="#ea4335" stroke-width="2"/><text x="1262" y="301" font-size="16" font-weight="700" fill="#b91c1c">正解／不正解</text><text x="1262" y="323" font-size="14" fill="#4b5563">正解で復習から外れ、間違いは翌朝</text><text x="1262" y="342" font-size="14" fill="#4b5563">9:00（東京）に再出題</text><path d="M1374.0 363 V393" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1248" y="395" width="252" height="88" rx="12" fill="#fff" stroke="#ea4335" stroke-width="2"/><text x="1262" y="423" font-size="16" font-weight="700" fill="#b91c1c">難易度の自動調整</text><text x="1262" y="445" font-size="14" fill="#4b5563">直近6回で5回正解なら上げ、2回以</text><text x="1262" y="464" font-size="14" fill="#4b5563">下なら下げる</text><path d="M1374.0 485 V515" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1248" y="517" width="252" height="88" rx="12" fill="#fff" stroke="#ea4335" stroke-width="2"/><text x="1262" y="545" font-size="16" font-weight="700" fill="#b91c1c">「なぜ？」を説明</text><text x="1262" y="567" font-size="14" fill="#4b5563">文章で説明するとGeminiが0〜10</text><text x="1262" y="586" font-size="14" fill="#4b5563">点で採点</text><path d="M1374.0 607 V637" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1248" y="639" width="252" height="88" rx="12" fill="#fff" stroke="#ea4335" stroke-width="2"/><text x="1262" y="667" font-size="16" font-weight="700" fill="#b91c1c">8点以上で合格</text><text x="1262" y="689" font-size="14" fill="#4b5563">合計20XPまで。足りなければ改善</text><text x="1262" y="708" font-size="14" fill="#4b5563">点と再挑戦</text><path d="M1374.0 729 V759" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1248" y="761" width="252" height="69" rx="12" fill="#fff" stroke="#ea4335" stroke-width="2"/><text x="1262" y="789" font-size="16" font-weight="700" fill="#b91c1c">追加質問</text><text x="1262" y="811" font-size="14" fill="#4b5563">問題に沿って1日5回まで質問</text><path d="M1500 795.5 H1525.0 V204.5 H1548" stroke="#ea4335" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="1540" y="116" width="272" height="712" rx="16" fill="#f3e8fd" fill-opacity="0.45"/><rect x="1540" y="116" width="272" height="40" rx="16" fill="#9334e6"/><rect x="1540" y="136" width="272" height="20" fill="#9334e6"/><text x="1676.0" y="142" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">5 · コミュニティ</text><rect x="1550" y="170" width="252" height="69" rx="12" fill="#fff" stroke="#9334e6" stroke-width="2"/><text x="1564" y="198" font-size="16" font-weight="700" fill="#6b21a8">いいね・保存・共有</text><text x="1564" y="220" font-size="14" fill="#4b5563">/questions/:id の共有リンク</text><path d="M1676.0 241 V271" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="1550" y="273" width="252" height="69" rx="12" fill="#fff" stroke="#9334e6" stroke-width="2"/><text x="1564" y="301" font-size="16" font-weight="700" fill="#6b21a8">コメント</text><text x="1564" y="323" font-size="14" fill="#4b5563">投稿・削除・「役に立った」</text><path d="M1676.0 344 V374" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>